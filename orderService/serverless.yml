# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: itsjohndevapps
# "service" is the name of this project. This will also be added to your AWS resource names.
service: orderService

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-southeast-2
  environment:
    ORDERS_TABLE: Orders
    SQS_QUEUE_URL: https://sqs.ap-southeast-2.amazonaws.com/032844083309/OrderQueue
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "dynamodb:PutItem"
        - "sqs:SendMessage"
        - "sqs:ReceiveMessage"
        - "sqs:DeleteMessage"
        - "ses:SendEmail"
      Resource:
        - Fn::GetAtt: [OrdersTable, Arn]
        - Fn::GetAtt: [OrdersQueue, Arn]
        - arn:aws:ses:ap-southeast-2:032844083309:identity/johncarloaguilar.pinlac@gmail.com
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Orders
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
    OrdersQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: OrderQueue
    OrderServiceEmailIdentity:
      Type: AWS::SES::EmailIdentity
      Properties:
        EmailIdentity: johncarloaguilar.pinlac@gmail.com

functions:
  placeOrder:
    handler: handlers/placeOrder.placeOrder
    events:
      - httpApi:
          path: /place-order
          method: post
  processOrder:
    handler: handlers/processOrder.processOrder
    events:
      - sqs:
          arn:
            Fn::GetAtt: [OrdersQueue, Arn]
